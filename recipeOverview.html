<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Review Recipe Card</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>
</head>
<body>
    <div id="RecipeCardOverview">
        <img>
        <div class="RecipeCardDetails">
            <h1 id="RecipeCardName"></h1>
            <h2 id="RecipeCardCategory"></h2>
            <h2 id="RecipeCardCookTime"></h2>
            <h2 id="RecipeCardServingSize"></h2>
            <div id="RecipeCardOptions">
                <button id="RecipeCardOptionFavorite"></button>
                <button id="RecipeCardOptionEdit"></button>
                <button id="RecipeCardOptionDelete"></button>
            </div>
        </div>

        <div class="RecipeCardingredients">
            <h2>Ingredients</h2>
            <ul id="RecipeCardingredientsList"></ul>
        </div>
        <div class="RecipeCardPreperationSteps">
            <h2>Instructions</h2>
            <ol id="RecipeCardInstructions"></ol>
        </div>
    </div>
    <button id="RecipeCardBack"></button>
</body>
</html>
